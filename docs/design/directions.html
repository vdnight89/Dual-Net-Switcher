<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>双网卡管家 · 方向比较</title><style>body{margin:30px;background:#e9edf0;color:#182a35;font:15px 'Microsoft YaHei UI',sans-serif}h1{font-size:24px}.grid{display:grid;gap:28px}section{background:white;padding:20px}iframe{width:100%;height:650px;border:1px solid #ddd}p{color:#435865}</style><h1>双网卡管家 · 三个界面方向</h1><p>同一任务：确认两个出口，维护路由规则，预览并应用。选择 A：规则主导，出口并排，日常修改路径最短。</p><div class="grid"><section><h2>A · 线路工作台（选定）</h2><p>雾灰背景与松绿色操作；两条出口并排，完整规则表是主角。</p><iframe src="direction-a.html"></iframe></section><section><h2>B · 调度控制台</h2><p>深海蓝、等宽数字；左侧线路拓扑，右侧规则和执行事件。</p><iframe src="direction-b.html"></iframe></section><section><h2>C · 设置向导</h2><p>中性黑白与橙色动作；先选出口，再逐步维护规则，适合低频首次使用。</p><iframe src="direction-c.html"></iframe></section></div></html>
